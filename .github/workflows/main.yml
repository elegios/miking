name: Miking CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and opam for Miking
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install opam packages
        run: |
          # Install all opam packages used in make test.  The numerics
          # support library lib/mi-stats is built from vendored sources by
          # the repository's own dune project and needs only a C++ compiler,
          # which the runner image already provides.
          opam install -y dune linenoise pyml toml lwt ocamlformat.0.29.0

      - name: Build Miking
        timeout-minutes: 10
        run: |
          eval $(opam env)
          make install

      - name: Run tests
        timeout-minutes: 60
        run: |
          eval $(opam env)
          make test

  build-and-test-mac-os:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OCaml and opam for Miking
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install opam packages
        run: |
          # Install all opam packages used in make test.  See the Linux job:
          # lib/mi-stats needs only a C++ compiler, here Apple Clang, which
          # doubles as our check that the vendored sources build on a second
          # compiler as well as a second platform.
          opam install -y dune linenoise pyml toml lwt menhir ocamlformat.0.29.0

      - name: Build Miking
        timeout-minutes: 30
        run: |
          eval $(opam env)
          make install

      - name: Run tests
        timeout-minutes: 60
        run: |
          eval $(opam env)
          make test
